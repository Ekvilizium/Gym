function muscle(name){let n=name.toLowerCase();if(/бицепс|молот|ez/.test(n))return 'Бицепс';if(/трицепс|разгибание рук|канат.*вниз/.test(n))return 'Трицепс';if(/икр|носки/.test(n))return 'Икры';if(/пресс|скручив|планка/.test(n))return 'Пресс';if(/ягодич|мост/.test(n))return 'Ягодицы';if(/ног|присед|болгар|выпад/.test(n))return 'Ноги';if(/плеч|сторон|мах|бабочка.*обрат|обрат.*бабочка|жим гантелей сидя|дельт/.test(n))return 'Плечи';if(/тяг|подтяг|пуловер/.test(n))return 'Спина';if(/жим|кроссовер|сведен|отжим/.test(n))return 'Грудь';return info(name)?.[0]||'Другие'}

let statPeriod=30,statMode='weight';function graph(points,unit){if(!points.length)return '<p class="muted">Пока нет данных за этот период.</p>';let min=Math.min(...points.map(p=>p.w)),max=Math.max(...points.map(p=>p.w)),lo=min===max?min-1:min-(max-min)*.15,hi=max===min?max+1:max+(max-min)*.15,x=i=>points.length===1?160:42+i*260/(points.length-1),y=v=>135-(v-lo)/(hi-lo)*112,coords=points.map((p,i)=>x(i)+','+y(p.w)).join(' ');return '<svg class="progressGraph" viewBox="0 0 320 166" role="img" aria-label="График прогресса"><defs><linearGradient id="graphFill" x2="0" y2="1"><stop stop-color="#c5f77d" stop-opacity=".3"/><stop offset="1" stop-color="#c5f77d" stop-opacity="0"/></linearGradient></defs>'+[0,.5,1].map(t=>'<path d="M42 '+y(lo+(hi-lo)*t)+'H302" stroke="currentColor" opacity=".12"/><text x="2" y="'+(y(lo+(hi-lo)*t)+4)+'" fill="currentColor" font-size="9">'+Math.round(lo+(hi-lo)*t)+'</text>').join('')+'<polygon points="'+x(0)+',135 '+coords+' '+x(points.length-1)+',135" fill="url(#graphFill)"/><polyline points="'+coords+'" fill="none" stroke="#91bd49" stroke-width="2.5" stroke-linejoin="round"/>'+points.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.w)+'" r="4" fill="#a6d75d"><title>'+esc(p.date+' · '+p.w+' '+unit)+'</title></circle>').join('')+'<text x="42" y="155" font-size="10" fill="currentColor">'+esc(points[0].date.slice(5))+'</text><text x="302" y="155" text-anchor="end" font-size="10" fill="currentColor">'+esc(points.at(-1).date.slice(5))+'</text></svg>'}
function stats(){let all=Object.values(S.sessions),cut=new Date();cut.setDate(cut.getDate()-statPeriod+1);let since=new Date(cut-cut.getTimezoneOffset()*60000).toISOString().slice(0,10),sessions=all.filter(s=>!statPeriod||s.date>=since),rows=sessions.flatMap(s=>s.ex.flatMap(e=>e.rows.filter(r=>r.done))),names=[...new Set(all.flatMap(s=>s.ex.map(e=>e.name)))];if(!names.includes(statName))statName=names[0]||'';let map=new Map();for(let s of sessions){let rr=s.ex.filter(e=>e.name===statName).flatMap(e=>e.rows.filter(r=>r.done&&+r.r>0&&+r.w>0));if(!rr.length)continue;let v=statMode==='volume'?rr.reduce((n,r)=>n+(+r.w)*(+r.r),0):Math.max(...rr.map(r=>+r.w));map.set(s.date,statMode==='volume'?(map.get(s.date)||0)+v:Math.max(map.get(s.date)||0,v))}let points=[...map].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,w])=>({date,w})),body=S.body.filter(x=>!statPeriod||x.date>=since).map(x=>({date:x.date,w:+x.w})).sort((a,b)=>a.date.localeCompare(b.date)),delta=points.length>1?points.at(-1).w-points[0].w:null;app.innerHTML='<div class="eyebrow">PERFORMANCE ANALYTICS</div><h1>Твой прогресс</h1><div class="periods">'+[7,30,90,0].map(n=>act('period',n,n?n+' дн.':'Всё',n===statPeriod?'primary':'')).join('')+'</div><div class="grid"><div class="metric"><small>ТРЕНИРОВКИ</small><b>'+sessions.filter(s=>s.finished).length+'</b></div><div class="metric"><small>ПОДХОДЫ</small><b>'+rows.length+'</b></div><div class="metric"><small>ТОННАЖ, КГ</small><b>'+Math.round(rows.reduce((n,r)=>n+(+r.w||0)*(+r.r||0),0)).toLocaleString('ru')+'</b></div><div class="metric"><small>ВЕС ТЕЛА, КГ</small><b>'+esc(S.body.at(-1)?.w||'—')+'</b></div></div><div class="card"><h3>Динамика упражнения</h3><select id="statName">'+names.map(n=>'<option '+(n===statName?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select><div class="periods">'+act('statMode','weight','Рабочий вес',statMode==='weight'?'primary':'')+act('statMode','volume','Тоннаж',statMode==='volume'?'primary':'')+'</div>'+(points.length?'<div c const val=id=>document.getElementById(id).value;const libraryNames=[...new Set([...BASE.flatMap(d=>d.ex.map(e=>e.name)),'Жим гантелей лёжа','Отжимания','Подтягивания','Тяга гантели одной рукой','Жим штанги стоя','Тяга каната к лицу','Французский жим','Сгибание на скамье Скотта','Гиперэкстензия','Планка','Подъём ног в висе','Сгибание ног лёжа','Отведение бедра','Приведение бедра','Жим Арнольда','Пуловер на блоке'])];const CATALOG=[["Грудь","Штанга","Жим штанги лёжа","Сведи лопатки, поставь стопы на пол. Опускай гриф контролируемо к груди, выжимай без отбива."],["Грудь","Гантели","Жим гантелей под углом 30°","Установи наклон около 30°. Опускай гантели по сторонам груди, не разводя локти чрезмерно."],["Грудь","Гантели","Жим гантелей лёжа","Удерживай лопатки на скамье. Опускай гантели плавно, выжимай над грудью."],["Грудь","Блок","Сведение рук в кроссовере","Слегка согни локти и сохраняй угол. Своди руки перед грудью без раскачки."],["Грудь","Свой вес","Отжимания","Держи корпус прямым. Опускай грудь между ладонями и выпрямляй руки."],["Спина","Блок","Тяга верхнего блока","Тяни рукоять к верхней части груди, направляя локти вниз. Не отклоняйся резко."],["Спина","Блок","Горизонтальная тяга блока","Сохраняй нейтральную спину. Тяни локти назад, не раскачивая корпус."],["Спина","Тренажёр","Тяга Т-грифа с упором грудью","Прижми грудь к опоре. Тяни локти назад и плавно возвращай рукоять."],["Спина","Свой вес","Подтягивания","Начинай из контролируемого виса. Тяни локти вниз без махов ногами."],["Спина","Гантели","Тяга гантели одной рукой","Обопрись свободной рукой. Тяни гантель к тазу без поворота корпуса."],["Плечи","Гантели","Жим гантелей сидя","Удерживай спину на опоре. Выжимай гантели вверх без чрезмерного прогиба."],["Плечи","Гантели","Разведение гантелей в стороны","Поднимай руки в стороны до комфортной высоты, без рывков и подъёма плеч."],["Плечи","Тренажёр","Обратная бабочка","Прижми грудь к опоре. Разводи руки назад с мягкими локтями."],["Плечи","Блок","Тяга каната к л holder="Поиск по названию" value="'+esc(libQ)+'"><div class="grid"><label>Мышцы<select id="libMuscle"><option value="">Все</option>'+[...new Set(CATALOG.map(x=>x[0]))].map(x=>'<option '+(x===libMuscle?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><label>Оборудование<select id="libEquipment"><option value="">Все</option>'+[...new Set(CATALOG.map(x=>x[1]))].map(x=>'<option '+(x===libEquipment?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label></div></div><div id="libCards"></div>';libCards()}const SECONDARY={'Грудь':['Трицепс','Плечи'],'Спина':['Бицепс'],'Плечи':['Трицепс'],'Ноги':['Ягодицы'],'Ягодицы':['Ноги']};function secondary(x){let n=x[2];if(/жим/.test(n)&&x[0]==='Грудь'||n==='Отжимания')return SECONDARY.Грудь;if(x[0]==='Спина'&&!/пуловер/.test(n))return SECONDARY.Спина;if(x[0]==='Плечи'&&/жим/.test(n))return SECONDARY.Плечи;if(/присед|жим ногами|выпад/.test(n))return SECONDARY.Ноги;if(x[0]==='Ягодицы')return SECONDARY.Ягодицы;return []}function libCards(){let list=CATALOG.filter(x=>(!libMuscle||x[0]===libMuscle)&&(!libEquipment||x[1]===libEquipment)&&x[2].toLowerCase().includes(libQ.toLowerCase()));document.getElementById('libCards').innerHTML='<p class="eyebrow">'+list.length+' упражнений</p><div class="libraryGrid">'+list.map(x=>'<button class="libraryTile" data-act="exerciseDetail" data-id="'+CATALOG.indexOf(x)+'"><div class="libraryArt">'+bodyMap({[x[0]]:1})+'</div><div class="tileText"><small>'+esc(x[0]+' · '+x[1])+'</small><h3>'+esc(x[2])+'</h3><span>Техника и мышцы →</span></div></button>').join('')+'</div>'+(list.length?'':'<p>Нет совпадений</p>')}function exerciseDetail(i){let x=CATALOG[i];if(!x)return;let c={[x[0]]:3};for(let g of secondary(x))c[g]=1;modal.innerHTML='<div class="detailTop"><span class="eyebrow">EXERCISE GUIDE</span><button id="detailClose" aria-label="Закрыть">×</button></div><h2>'+esc(x[2])+'</h2><div class="chips"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div><div class="detailArt">'+bodyMap(c)+'</div><div class="legend"><span><i></i> Основные мышцы</span><span><i></i> Вспомогательные</span></div><h3>Техника выполнения</h3><p>'+esc(x[3])+'</p><h3>Работающие мышцы</h3><p>Основная группа: '+esc(x[0])+'. '+(secondary(x).length?'Дополнительно: '+esc(secondary(x).join(', '))+'.':'')+'</p><small>Схема условная, зависит от варианта упражнения.</small><a class="videoLink" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(x[2]+' техника упражнения')+'">▶ Найти видео техники</a>';modal.showModal();modal.querySelector('#detailClose').onclick=()=>modal.close()}
function recommendation(e){let prev=Object.values(S.sessions).filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>s.ex).find(x=>x.name===e.name&&x.rows.some(r=>r.done));let target=Number((e.reps.match(/\d+/g)||[]).at(-1));if(!prev||!target)return '';let rows=prev.rows;if(rows.length&&rows.every(r=>r.done&&+r.r>=target&&+r.w>0))return '<small class="hint">Все подходы достигли цели. При хорошей технике попробуй минимальную прибавку веса.</small>';return '<small class="hint">Сохраняй вес и постепенно увеличивай повторения до '+target+'.</small>'}function exForm(title,e,cb){form(title,input('Название упражнения','en',e?.name||'')+'<label>Выбрать из библиотеки<select id="lib"><option value="">Своё упражнение</option>'+[...new Set([...libraryNames,...CATALOG.map(x=>x[2])])].map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></label>'+input('Подходы','es',e?.sets||3,'number')+input('Целевые повторения','er',e?.reps||'8–12')+'<small>Можно выбрать любое название упражнения.</small>',()=>{let name=val('en').trim(),sets=+val('es'),reps=val('er').trim();if(!name||!Number.isInteger(sets)||sets<1||sets>30||!reps){alert('Укажи название, 1–30 подходов и повторения');return false}cb({...e,id:e?.id||uid(),name,sets,reps})})}
function startRest(){restTotal=S.rest;end=Date.now()+S.rest*1000;tick()}function tick(){let n=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('timer').hidden=!n;document.getElementById('ringProgress').setAttribute('stroke-dashoffset',169.65*(1-Math.min(1,n/restTotal)));document.getElementById('clock').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}setInterval(tick,500);
document.addEventListener('input',e=>{let t=e.target;if(t.id==='libQ'){libQ=t.value;libCards()}if(t.dataset.note!==undefined){ensure().ex[t.dataset.note].note=t.value;save()}if(t.dataset.row){let [i,j,k]=t.dataset.row.split(',');ensure().ex[i].rows[j][k]=t.value;save()}});
document.addEventListener('change',async e=>{let t=e.target;if(t.dataset.meta){let [i,j,k]=t.dataset.meta.split(',');ensure().ex[i].rows[j][k]=t.value;save()}if(t.id==='libMuscle'){libMuscle=t.value;libCards()}if(t.id==='libEquipment'){libEquipment=t.value;libCards()}if(t.id==='lib'&&t.value)document.getElementById('en').value=t.value;if(t.id==='date'){date=t.value||today();render()}if(t.id==='activePlan'){S.active=t.value;day=plan().days[0]?.id;save();render()}if(t.id==='measureKey'){measureKey=t.value;render()}if(t.id==='statName'){statName=t.value;render()}if(t.id==='planName'){let p=S.plans.find(p=>p.id===editPlan);if(t.value.trim())p.name=t.value.trim();save()}if(t.id==='restSeconds'){S.rest=Math.max(10,Math.min(600,+t.value||90));save();render()}if(t.id==='import'&&t.files[0]){try{let x=JSON.parse(await t.files[0].text());if(x.version!==3||!Array.isArray(x.plans)||!x.sessions||!Array.isArray(x.body)||!x.plans.every(p=>Array.isArray(p.days)&&p.days.every(d=>Array.isArray(d.ex)))||!Object.values(x.sessions).every(s=>Array.isArray(s.ex)&&s.ex.every(e=>Array.isArray(e.rows))))throw Error();if(confirm('Заменить локальные данные резервной копией?')){S=x;S.plans=[defaultPlan,...S.plans.filter(p=>p.id!=='base')];save();render()}}catch(err){alert('Некорректная резервная копия')}}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id||'',[i,j]=id.split(','),p=S.plans.find(p=>p.id===editPlan),d=p?.days.find(d=>d.id===i);switch(a){case'exerciseDetail':exerciseDetail(+id);return;case'editProfile':editProfile();return;case'measure':measure();return;case'deleteMeasure':if(confirm('Удалить замер? Запись веса в статистике останется.'))S.measurements=(S.measurements||[]).filter(x=>x.date!==id);break;case'focusStart':if(!currentDay())return;{let s=ensure();if(s.finished){alert('Сначала возобнови тренировку');return} s.startedAt??=Date.now();focusIndex=Math.max(0,s.ex.findIndex(e=>e.rows.some(r=>!r.done)));focusMode=true;}break;case'focusExit':focusMode=false;break;case'focusPrev':focusIndex--;break;case'focusNext':focusIndex++;break;case'view':focusMode=false;view=id;window.scrollTo(0,0);break;case'startHome':day=id;date=today();view='train';window.scrollTo(0,0);break;case'theme':S.theme=S.theme==='light'?'dark':'light';break;case'day':day=id;break;case'rest':startRest();return;case'plus':restTotal+=30;end+=30000;tick();return;case'stop':end=0;tick();return;case'done':{let r=ensure().ex[i].rows[j];if(!r.done&&(!Number.isFinite(+r.r)||+r.r<=0||r.w!==''&&(!Number.isFinite(+r.w)||+r.w<0))){alert('Укажи корректное количество повторений и вес');return}r.done=!r.done;if(r.done){ensure().startedAt??=Date.now();startRest();}break}case'addSet':{let rows=ensure().ex[i].rows,last=rows.at(-1);rows.push({w:last?.w||'',r:last?.r||'',done:false});break}case'removeSet':if(confirm('Удалить подход?'))ensure().ex[i].rows.splice(j,1);break;case'removeExercise':if(confirm('Удалить упражнение из этой тренировки?'))ensure().ex.splice(i,1);break;case'copyLast':{let ex=ensure().ex[i],prev=Object.values(S.sessions).filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>s.ex).find(e=>e.name===ex.name&&e.rows.some(r=>r.done));if(!prev){alert('Нет предыдущих результатов');return}ex.rows.forEach((r,j)=>{if(!r.done&&prev.rows[j]){r.w=prev.rows[j].w;r.r=prev.rows[j].r}});break}case'addExercise':exForm('Добавить упражнение',null,x=>ensure().ex.push(fresh(x)));return;case'period':statPeriod=+id;break;case'statMode':statMode=id;break;case'finish':if(!currentDay())return;{let s=ensure();s.finished=!s.finished;if(s.finished){s.endedAt=Date.now();focusMode=false;save();render();summary(s);return}else{delete s.endedAt}}break;case'use':S.active=id;day=plan().days[0]?.id;view='train';break;case'duplicate':{let x=clone(S.plans.find(p=>p.id===id));x.id=uid();x.name+=' — копия';S.plans.push(x);editPlan=x.id;break}case'newPlan':form('Новая программа',input('Название','pn'),()=>{let n=val('pn').trim();if(!n)return false;let x={id:uid(),name:n,days:[]};S.plans.push(x);editPlan=x.id});return;case'edit':editPlan=id;break;case'deletePlan':if(confirm('Удалить программу? История останется.')){S.plans=S.plans.filter(p=>p.id!==id);if(S.active===id)S.active='base';if(editPlan===id)editPlan=null}break;case'addDay':case'renameDay':form('Тренировочный день',input('Название','dn',d?.name||'')+input('Акцент','df',d?.focus||''),()=>{if(!val('dn').trim())return false;if(d){d.name=val('dn');d.focus=val('df')}else p.days.push({id:uid(),name:val('dn'),focus:val('df'),ex:[]})});return;case'deleteDay':if(confirm('Удалить день из шаблона?'))p.days=p.days.filter(x=>x.id!==id);break;case'templateEx':exForm('Упражнение',null,x=>d.ex.push(x));return;case'editEx':exForm('Редактировать',d.ex[j],x=>d.ex[j]=x);return;case'deleteEx':if(confirm('Удалить из шаблона?'))d.ex.splice(j,1);break;case'moveEx':if(+j>0)[d.ex[j-1],d.ex[j]]=[d.ex[j],d.ex[j-1]];break;case'openSession':{let s=S.sessions[id];if(!S.plans.some(p=>p.id===s.plan&&p.days.some(d=>d.id===s.day))){alert(s.ex.map(e=>e.name+': '+e.rows.map(r=>r.w+' кг × '+r.r).join(', ')).join('\n'));return}S.active=s.plan;day=s.day;date=s.date;view='train';break}case'deleteSession':if(confirm('Удалить запись навсегда?'))delete S.sessions[id];break;case'body':{let w=+val('bodyWeight');if(w<=0||w>500)return;S.body=S.body.filter(x=>x.date!==today());S.body.push({date:today(),w});S.body.sort((a,b)=>a.date.localeCompare(b.date));break}case'export':{let u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='gym-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}default:return}save();render()});save();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
