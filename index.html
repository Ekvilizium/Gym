try{let old=localStorage.getItem('gym-product-v3');if(old){S=JSON.parse(old);S.plans=[defaultPlan,...S.plans.filter(p=>p.id!=='base')]}else{let legacy=JSON.parse(localStorage.getItem('gym-v2')||'{}');for(let [k,v] of Object.entries(legacy)){let [dt,i]=k.split('|'),d=BASE[+i];if(!d)continue;let ex=clone(d.ex).map((e,j)=>({...e,rows:Array.from({length:e.sets},(_,n)=>({w:v[j+'-'+n+'-w']??'',r:v[j+'-'+n+'-r']??'',done:!!v[j+'-'+n+'-done']}))}));S.sessions[dt+'|base|'+d.id]={date:dt,plan:'base',day:d.id,name:d.name,ex,finished:false}}}}catch(e){warning.textContent='Не удалось прочитать локальные данные.'}
function save(){try{localStorage.setItem('gym-product-v3',JSON.stringify(S));warning.textContent=''}catch(e){warning.textContent='Хранилище недоступно. Сделай резервную копию в настройках.'}}
function plan(){return S.plans.find(p=>p.id===S.active)||S.plans[0]}function currentDay(){return plan().days.find(d=>d.id===day)||plan().days[0]}function key(){return date+'|'+plan().id+'|'+currentDay()?.id}function session(){return S.sessions[key()]}function fresh(e){return {...clone(e),rows:Array.from({length:e.sets},()=>({w:'',r:'',done:false}))}}function ensure(){let d=currentDay();if(!d)return null;return S.sessions[key()]??={date,plan:plan().id,day:d.id,name:d.name,ex:d.ex.map(fresh),finished:false}}function act(a,t='',label='',cls=''){return '<button type="button" class="'+cls+'" data-act="'+a+'" data-id="'+esc(t)+'">'+esc(label)+'</button>'}function input(label,id,value='',type='text'){return '<label>'+esc(label)+'<input id="'+id+'" type="'+type+'" value="'+esc(value)+'"></label>'}
const ICONS={"home":"<path d=\"m3 10 9-7 9 7v10h-6v-7H9v7H3z\"/>","train":"<path d=\"M6 7v10M3 9v6m15-8v10m3-8v6M6 12h12\"/>","plans":"<rect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/><path d=\"M9 4V2h6v2M9 10h6m-6 5h6\"/>","history":"<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/>","stats":"<path d=\"M3 20h18M5 16l5-6 4 3 6-8\"/>","library":"<path d=\"M4 5h6v15H4zM14 5h6v15h-6z\"/>"};function navIcon(v){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[v]||'')+'</svg>'}function home(){let p=plan(),now=new Date(),weekday=now.getDay(),offset=(weekday+6)%7,mon=new Date(now);mon.setDate(now.getDate()-offset);mon.setHours(0,0,0,0);let dates=Array.from({length:7},(_,i)=>{let d=new Date(mon);d.setDate(mon.getDate()+i);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}),week=Object.values(S.sessions).filter(s=>dates.includes(s.date)),completed=week.filter(s=>s.finished),volume=week.flatMap(s=>s.ex.flatMap(e=>e.rows.filter(r=>r.done))).reduce((n,r)=>n+(+r.w||0)*(+r.r||0),0),idx=p.id==='base'?(weekday<=2&&weekday!==0?0:weekday<=4&&weekday!==0?1:weekday<=6&&weekday!==0?2:0):0,d=p.days[idx]||p.days[0];app.innerHTML='<div class="eyebrow">'+now.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})+'</div><h1 class="headline">Становись<br><em>сильнее.</em></h1><div class="feature"><svg class="feature-art" viewBox="0 0 220 200" fill="none"><g transform="rotate(-32 110 100)" stroke="#c5f77d" stroke-width="12" stroke-linecap="round"><path d="M30 100h160M55 65v70M165 65v70M32 80v40M188 80v40"/></g><circle cx="110" cy="100" r="88" stroke="#ffffff18"/><circle cx="110" cy="100" r="70" stroke="#ffffff18"/></svg><div class="eyebrow">ТВОЯ ПРОГРАММА</div><h2>'+esc(d?.name||'Новая программа')+'</h2><p>'+esc(d?.focus||'Создай тренировочный день')+'</p><small>'+(d?.ex.length||0)+' упражнений · '+(d?.ex.reduce((n,e)=>n+e.sets,0)||0)+' подходов</small>'+act(d?'startHome':'view',d?.id||'plans',d?'Начать тренировку →':'Создать программу →','primary wide')+'</div><div class="sectiontitle"><h2>Эта неделя</h2><small>Активность</small></div><div class="grid"><div class="metric"><small>ТРЕНИРОВКИ</small><b>'+completed.length+' <small>/ '+p.days.length+'</small></b></div><div class="metric"><small>ОБЪЁМ, КГ</small><b>'+Math.round(volume).toLocaleString('ru')+'</b></div></div><div class="card week">'+dates.map((dt,i)=>'<div><small>'+['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'][i]+'</small><span class="'+(completed.some(s=>s.date===dt)?'hit':'')+(dt===today()?' current':'')+'">'+(completed.some(s=>s.date===dt)?'✓':Number(dt.slice(-2)))+'</span></div>').join('')+'</div><div class="sectiontitle"><h2>Быстрый доступ</h2></div><div class="grid">'+act('view','plans','Мои программы')+act('view','library','Упражнения')+act('view','history','История')+act('view','stats','Мой прогресс')+'</div>'}function render(){document.documentElement.dataset.theme=S.theme||'dark';document.getElementById('nav').innerHTML=[['home','','Главная'],['train','','Зал'],['plans','','Планы'],['stats','','Прогресс'],['library','','База']].map(([v,i,n])=>'<button data-act="view" data-id="'+v+'" class="'+(view===v?'active':'')+'"><span>'+navIcon(v)+'</span>'+n+'</button>').join('');if(view==='home')home();if(view==='train')train();if(view==='plans')plans();if(view==='history')history();if(view==='stats')stats();if(view==='settings')settings();if(view==='library')library()}
function train(){let p=plan(),d=currentDay(),s=session(),ex=s?.ex||d?.ex.map(fresh)||[],all=ex.flatMap(e=>e.rows),done=all.filter(r=>r.done).length;app.innerHTML='<div class="card"><label>Программа<select id="activePlan">'+S.plans.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===S.active?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select></label><div class="tabs">'+p.days.map(x=>act('day',x.id,x.name,x.id===d?.id?'active':'')).join('')+'</div>'+input('Дата тренировки','date',date,'date')+'<div class="row"><b>'+done+' / '+all.length+' подходов</b><small style="text-align:right">'+(s?.finished?'Завершена':'В процессе')+'</small></div><div class="track"><i style="width:'+(all.length?done/all.length*100:0)+'%"></i></div><div class="row">'+act('rest','','Отдых '+S.rest+' с')+act('finish','',s?.finished?'Возобновить':'Завершить','primary')+'</div></div><h2>'+esc(d?.focus||'Добавь тренировочный день')+'</h2>'+ex.map((e,i)=>exercise(e,i)).join('')+(d?act('addExercise','','+ Добавить упражнение','wide primary'):'')+'<p class="muted">Изменения здесь относятся только к выбранной тренировке. Шаблон редактируется в разделе «Программы».</p>'}
function previous(name){let list=Object.values(S.sessions).filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date));for(let s of list){let e=s.ex.find(e=>e.name===name);if(e){let r=e.rows.filter(r=>r.done&&r.w!==''&&r.r!=='');if(r.length)return r.map(x=>x.w+'×'+x.r).join(' · ')}}return '—'}
function exercise(e,i){let rows=e.rows;return '<article class="card '+(rows.length&&rows.every(r=>r.done)?'finished':'')+'"><div class="head">'+('<div class="miniMuscle">'+bodyMap({[muscle(e.name)]:1})+'</div>')+'<div><h3>'+esc(e.name)+'</h3><small>Цель: '+esc(e.reps)+' повторений · ранее: '+esc(previous(e.name))+'</small><br><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(e.name+' техника упражнения')+'">Видео техники ↗</a></div>'+act('removeExercise',i,'×','danger')+'</div><div class="set"><small>№</small><small>кг</small><small>повт.</small><small>готово</small><small></small></div>'+rows.map((r,j)=>'<div class="set"><small>'+(j+1)+'</small><input aria-label="Вес" type="number" min="0" step="0.25" inputmode="decimal" data-row="'+i+','+j+',w" value="'+esc(r.w)+'"><input aria-label="Повторения" type="number" min="0" step="1" inputmode="numeric" data-row="'+i+','+j+',r" value="'+esc(r.r)+'">'+act('done',i+','+j,r.done?'✓':'○',r.done?'done':'')+act('removeSet',i+','+j,'−')+'</div>').join('')+'<div class="row">'+act('addSet',i,'+ Добавить подход','primary')+act('copyLast',i,'Повторить прошлый')+'</div>'+recommendation(e)+(info(e.name)?'<details><summary>Техника выполнения</summary><p>'+esc(info(e.name)[3])+'</p></details>':'')+'<label>Заметка<input data-note="'+i+'" value="'+esc(e.note||'')+'" placeholder="Техника, самочувствие"></label></article>'}
function plans(){app.innerHTML='<h2>Программы</h2>'+S.plans.map(p=>'<div class="card"><h3>'+esc(p.name)+'</h3><p class="muted">'+p.days.length+' дней · '+p.days.reduce((n,d)=>n+d.ex.length,0)+' упражнений</p><div class="row">'+act('use',p.id,'Выбрать','primary')+act('duplicate',p.id,'Копировать')+(p.id==='base'?'':act('edit',p.id,'Редактировать')+act('deletePlan',p.id,'Удалить','danger'))+'</div></div>').join('')+act('newPlan','','+ Создать программу','wide primary')+(editPlan?editor():'')}
function editor(){let p=S.plans.find(p=>p.id===editPlan);if(!p)return '';return '<div class="card"><h2>Конструктор</h2>'+input('Название','planName',p.name)+p.days.map((d,i)=>'<div class="card"><h3>'+esc(d.name)+' · '+esc(d.focus)+'</h3><div class="row">'+act('renameDay',d.id,'Название')+act('deleteDay',d.id,'Удалить день','danger')+'</div>'+d.ex.map((e,j)=>'<div class="row" style="margin:8px 0"><span>'+esc(e.name)+'<br><small>'+e.sets+' × '+esc(e.reps)+'</small></span>'+act('editEx',d.id+','+j,'✎','fit')+act('moveEx',d.id+','+j,'↑','fit')+act('deleteEx',d.id+','+j,'×','fit danger')+'</div>').join('')+act('templateEx',d.id,'+ Упражнение','wide')+'</div>').join('')+act('addDay','','+ День','wide primary')+'</div>'}
function history(){let list=Object.entries(S.sessions).sort((a,b)=>b[1].date.localeCompare(a[1].date));app.innerHTML='<h2>История</h2>'+(list.length?list.map(([k,s])=>'<div class="card"><h3>'+esc(s.date)+' · '+esc(s.name)+'</h3><p class="muted">'+s.ex.flatMap(e=>e.rows).filter(r=>r.done).length+' выполненных подходов · '+(s.finished?'Завершена':'Черновик')+'</p><div class="row">'+act('openSession',k,'Открыть','primary')+act('deleteSession',k,'Удалить','danger')+'</div></div>').join(''):'<div class="card">Пока нет записей. Начни тренировку.</div>')}
function muscle(name){let n=name.toLowerCase();if(/бицепс|молот|ez/.test(n))return 'Бицепс';if(/трицепс|разгибание рук|канат.*вниз/.test(n))return 'Трицепс';if(/икр|носки/.test(n))return 'Икры';if(/пресс|скручив|планка/.test(n))return 'Пресс';if(/ягодич|мост/.test(n))return 'Ягодицы';if(/ног|присед|болгар|выпад/.test(n))return 'Ноги';if(/плеч|сторон|мах|бабочка.*обрат|обрат.*бабочка|жим гантелей сидя|дельт/.test(n))return 'Плечи';if(/тяг|подтяг|пуловер/.test(n))return 'Спина';if(/жим|кроссовер|сведен|отжим/.test(n))return 'Грудь';return info(name)?.[0]||'Другие'}
function bodyMap(counts){let max=Math.max(1,...Object.values(counts));let color=g=>counts[g]?'#c5f77d':'#34424d',op=g=>counts[g]?0.35+0.65*counts[g]/max:1;let shape=(g,d)=>'<path d="'+d+'" fill="'+color(g)+'" opacity="'+op(g)+'" stroke="#111a22" stroke-width="1.5"><title>'+g+': '+(counts[g]||0)+' подходов</title></path>';let figure=back=>'<g transform="translate('+(back?165:15)+' 0)"><ellipse cx="65" cy="22" rx="15" ry="19" fill="#34424d"/><path d="M57 40h16l4 13H53z" fill="#34424d"/>'+shape('Плечи','M52 49Q28 44 22 70L36 83 49 66Z M78 49Q102 44 108 70L94 83 81 66Z')+shape(back?'Спина':'Грудь','M52 51L64 55V84L43 78 40 66Z M78 51L66 55V84L87 78 90 66Z')+shape(back?'Спина':'Пресс','M43 80L64 87 65 122 49 115Z M87 80L66 87 65 122 81 115Z')+shape(back?'Трицепс':'Бицепс','M23 73L36 85 28 116 15 112Z M107 73L94 85 102 116 115 112Z')+'<path d="M15 113L28 117 18 150 8 148Z M115 113L102 117 112 150 122 148Z" fill="#34424d"/>'+shape(back?'Ягодицы':'Ноги','M49 117L64 124 63 146 42 148 40 132Z M81 117L66 124 67 146 88 148 90 132Z')+shape('Ноги','M42 150L63 148 60 202 45 207 38 180Z M88 150L67 148 70 202 85 207 92 180Z')+shape('Икры','M45 209L60 204 58 247 48 250Z M85 209L70 204 72 247 82 250Z')+'<path d="M48 249h10l4 12H38z M82 249H72l-4 12h24z" fill="#34424d"/></g>';return '<svg class="bodymap" viewBox="0 0 310 282" role="img" aria-label="Схема основных групп мышц">'+figure(false)+figure(true)+'<g fill="currentColor" font-size="10" text-anchor="middle"><text x="80" y="278">СПЕРЕДИ</text><text x="230" y="278">СЗАДИ</text></g></svg>'}
function muscleCounts(ex){let c={};for(let e of ex){let g=muscle(e.name);c[g]=(c[g]||0)+e.rows.filter(r=>r.done).length}return c}
function musclePanel(ex){let c=muscleCounts(ex);return '<div class="card"><h3>Карта нагрузки</h3><small>Выполненные подходы по основной группе мышц</small>'+bodyMap(c)+'<div class="musclelist">'+Object.entries(c).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(([g,n])=>'<div><span>'+esc(g)+'</span><b>'+n+'</b></div>').join('')+'</div><small>Условная оценка по названию упражнения, без учёта вторичных мышц.</small></div>'}
function summary(s){let rows=s.ex.flatMap(e=>e.rows),done=rows.filter(r=>r.done),vol=done.reduce((n,r)=>n+(+r.w||0)*(+r.r||0),0);modal.innerHTML='<div class="successmark">✓</div><h2>Тренировка завершена!</h2><p>'+esc(s.name)+' · '+esc(s.date)+'</p><div class="grid"><div class="metric"><small>Подходы</small><b>'+done.length+'/'+rows.length+'</b></div><div class="metric"><small>Объём, кг</small><b>'+Math.round(vol)+'</b></div></div>'+musclePanel(s.ex)+'<button class="primary wide" id="summaryClose">Отлично!</button>';modal.showModal();modal.querySelector('#summaryClose').onclick=()=>{modal.close();view='home';render()}}
function calendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),dates=new Set(Object.values(S.sessions).filter(s=>s.finished).map(s=>s.date));return '<div class="card"><h3>Календарь · '+now.toLocaleDateString('ru',{month:'long',year:'numeric'})+'</h3><div class="calendar">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<small>'+x+'</small>').join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:n},(_,i)=>{let dt=y+'-'+String(m+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0');return '<span class="'+(dates.has(dt)?'hit':'')+'">'+(i+1)+'</span>'}).join('')+'</div><small>Зелёным отмечены завершённые тренировки</small></div>'}
function records(){let map=new Map();for(let s of Object.values(S.sessions))for(let e of s.ex)for(let r of e.rows){let w=+r.w,n=+r.r;if(!r.done||w<=0||n<=0)continue;let old=map.get(e.name);if(!old||w>old.w||(w===old.w&&n>old.n))map.set(e.name,{w,n,date:s.date});}return '<div class="card"><h3>Личные рекорды</h3>'+([...map].map(([name,r])=>'<p>'+esc(name)+'<br><b>'+r.w+' кг × '+r.n+'</b> <small>'+esc(r.date)+'</small></p>').join('')||'<p class="muted">Пока нет выполненных подходов с весом.</p>')+'</div>'}
function stats(){let sessions=Object.values(S.sessions),rows=sessions.flatMap(s=>s.ex.flatMap(e=>e.rows.filter(r=>r.done))),names=[...new Set(sessions.flatMap(s=>s.ex.map(e=>e.name)))];if(!names.includes(statName))statName=names[0]||'';let points=sessions.map(s=>({date:s.date,w:Math.max(0,...s.ex.filter(e=>e.name===statName).flatMap(e=>e.rows.filter(r=>r.done&&r.w!==''&&+r.r>0).map(r=>+r.w)))})).filter(x=>x.w>0).sort((a,b)=>a.date.localeCompare(b.date));let max=Math.max(1,...points.map(x=>x.w));app.innerHTML='<h2>Прогресс</h2><div class="grid"><div class="metric"><b>'+sessions.filter(s=>s.finished).length+'</b><small>Тренировок</small></div><div class="metric"><b>'+rows.length+'</b><small>Подходов</small></div><div class="metric"><b>'+Math.round(rows.reduce((n,r)=>n+(+r.w||0)*(+r.r||0),0))+'</b><small>Объём, кг</small></div><div class="metric"><b>'+esc(S.body.at(-1)?.w||'—')+'</b><small>Вес тела, кг</small></div></div><div class="card"><h3>Рабочие веса</h3><select id="statName">'+names.map(n=>'<option '+(n===statName?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select>'+(points.length?'<div class="chart">'+points.slice(-15).map(x=>'<div title="'+esc(x.date+': '+x.w+' кг')+'" style="height:'+x.w/max*100+'%"></div>').join('')+'</div><p>Максимум: '+max+' кг</p>'+points.slice(-5).reverse().map(x=>'<p class="muted">'+esc(x.date)+' · '+x.w+' кг</p>').join(''):'<p class="muted">Отмечай подходы с весом и повторениями.</p>')+'</div><div class="card"><h3>Вес тела</h3>'+input('Вес, кг','bodyWeight','','number')+act('body','','Записать вес','primary')+S.body.slice(-7).reverse().map(x=>'<p class="muted">'+esc(x.date)+' · '+esc(x.w)+' кг</p>').join('')+'</div>'+records()}
function settings(){app.innerHTML='<h2>Настройки</h2><div class="card">'+act('theme','','Светлая / тёмная тема','wide')+'</div><div class="card">'+input('Таймер отдыха, секунд','restSeconds',S.rest,'number')+'<p class="muted">Таймер запускается после отметки подхода.</p></div><div class="card"><h3>Резервная копия</h3><p>Данные хранятся на этом устройстве. Экспортируй их перед очисткой браузера.</p>'+act('export','','Экспорт JSON','wide primary')+'<label>Восстановить из JSON<input type="file" id="import" accept=".json,application/json"></label></div><div class="card"><h3>Рекомендации</h3><p>Отдых 2–3 минуты в базовых, 1–2 минуты в изолирующих. Оставляй 1–2 повтора в запасе. Начинай с 2–3 рабочих подходов, если объём слишком велик.</p><p>Для набора массы: ориентир 2700–2900 ккал, белок 130–160 г, жиры 60–80 г. Корректируй по динамике веса.</p></div>'}
function form(title,fields,cb){modal.innerHTML='<h2>'+esc(title)+'</h2><form id="mf">'+fields+'<div class="row"><button type="button" id="cancel">Отмена</button><button class="primary">Сохранить</button></div></form>';modal.showModal();modal.querySelector('#cancel').onclick=()=>modal.close();modal.querySelector('form').onsubmit=e=>{e.preventDefault();if(cb()!==false){modal.close();save();render()}}}
const val=id=>document.getElementById(id).value;const libraryNames=[...new Set([...BASE.flatMap(d=>d.ex.map(e=>e.name)),'Жим гантелей лёжа','Отжимания','Подтягивания','Тяга гантели одной рукой','Жим штанги стоя','Тяга каната к лицу','Французский жим','Сгибание на скамье Скотта','Гиперэкстензия','Планка','Подъём ног в висе','Сгибание ног лёжа','Отведение бедра','Приведение бедра','Жим Арнольда','Пуловер на блоке'])];const CATALOG=[["Грудь","Штанга","Жим штанги лёжа","Сведи лопатки, поставь стопы на пол. Опускай гриф контролируемо к груди, выжимай без отбива."],["Грудь","Гантели","Жим гантелей под углом 30°","Установи наклон около 30°. Опускай гантели по сторонам груди, не разводя локти чрезмерно."],["Грудь","Гантели","Жим гантелей лёжа","Удерживай лопатки на скамье. Опускай гантели плавно, выжимай над грудью."],["Грудь","Блок","Сведение рук в кроссовере","Слегка согни локти и сохраняй угол. Своди руки перед грудью без раскачки."],["Грудь","Свой вес","Отжимания","Держи корпус прямым. Опускай грудь между ладонями и выпрямляй руки."],["Спина","Блок","Тяга верхнего блока","Тяни рукоять к верхней части груди, направляя локти вниз. Не отклоняйся резко."],["Спина","Блок","Горизонтальная тяга блока","Сохраняй нейтральную спину. Тяни локти назад, не раскачивая корпус."],["Спина","Тренажёр","Тяга Т-грифа с упором грудью","Прижми грудь к опоре. Тяни локти назад и плавно возвращай рукоять."],["Спина","Свой вес","Подтягивания","Начинай из контролируемого виса. Тяни локти вниз без махов ногами."],["Спина","Гантели","Тяга гантели одной рукой","Обопрись свободной рукой. Тяни гантель к тазу без поворота корпуса."],["Плечи","Гантели","Жим гантелей сидя","Удерживай спину на опоре. Выжимай гантели вверх без чрезмерного прогиба."],["Плечи","Гантели","Разведение гантелей в стороны","Поднимай руки в стороны до комфортной высоты, без рывков и подъёма плеч."],["Плечи","Тренажёр","Обратная бабочка","Прижми грудь к опоре. Разводи руки назад с мягкими локтями."],["Плечи","Блок","Тяга каната к лицу","Тяни канат к лицу, разводя кисти. Не прогибай поясницу."],["Бицепс","Штанга","Подъём EZ-штанги на бицепс","Держи локти рядом с корпусом. Сгибай руки без раскачки."],["Бицепс","Гантели","Подъём гантелей на бицепс","Сгибай локти, не выводя плечи вперёд. Опускай вес контролируемо."],["Бицепс","Гантели","Молотки с гантелями","Сохраняй нейтральный хват и неподвижные плечи."],["Трицепс","Блок","Разгибание рук с канатом","Прижми локти к корпусу. Разгибай руки вниз, не помогая плечами."],["Трицепс","Блок","Разгибание рук из-за головы","Удерживай локти направленными вперёд. Разгибай руки без прогиба поясницы."],["Трицепс","Блок","Разгибание рук на блоке","Зафиксируй плечи и разгибай локти до комфортной амплитуды."],["Ноги","Тренажёр","Жим ногами","Держи таз на спинке. Опускай платформу до комфортной глубины, колени направляй по стопам."],["Ноги","Штанга","Приседания","Удерживай стопы на полу и нейтральную спину. Колени направляй по стопам."],["Ноги","Тренажёр","Гакк-приседания","Прижми спину к опоре. Опускайся контролируемо, не отрывая пятки."],["Ноги","Гантели","Болгарские выпады","Поставь заднюю стопу на опору. Опускайся на передней ноге, сохраняя равновесие."],["Ноги","Тренажёр","Сгибание ног сидя","Совмести ось тренажёра с коленом. Сгибай ноги без отрыва таза."],["Ноги","Тренажёр","Разгибание ног","Совмести ось тренажёра с коленом. Разгибай ноги плавно без рывка."],["Ягодицы","Штанга","Ягодичный мост","Поднимай таз за счёт ягодиц, не переразгибая поясницу."],["Икры","Тренажёр","Подъём на носки","Поднимай пятки и плавно опускай их в комфортной амплитуде."],["Пресс","Блок","Скручивания на блоке","Сближай рёбра и таз, не тяни канат руками."],["Пресс","Свой вес","Планка","Держи корпус прямым, дыши спокойно, не проваливай поясницу."]];let libQ='',libMuscle='',libEquipment='';function info(name){return CATALOG.find(x=>x[2]===name)||CATALOG.find(x=>name.includes(x[2]))}function library(){app.innerHTML='<h2>Библиотека упражнений</h2><div class="card"><input id="libQ" placeholder="Поиск по названию" value="'+esc(libQ)+'"><div class="grid"><label>Мышцы<select id="libMuscle"><option value="">Все</option>'+[...new Set(CATALOG.map(x=>x[0]))].map(x=>'<option '+(x===libMuscle?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><label>Оборудование<select id="libEquipment"><option value="">Все</option>'+[...new Set(CATALOG.map(x=>x[1]))].map(x=>'<option '+(x===libEquipment?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label></div></div><div id="libCards"></div>';libCards()}function libCards(){let list=CATALOG.filter(x=>(!libMuscle||x[0]===libMuscle)&&(!libEquipment||x[1]===libEquipment)&&x[2].toLowerCase().includes(libQ.toLowerCase()));document.getElementById('libCards').innerHTML=list.map(x=>'<div class="card"><small>'+esc(x[0]+' · '+x[1])+'</small><h3>'+esc(x[2])+'</h3><p>'+esc(x[3])+'</p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(x[2]+' техника упражнения')+'">Видео техники ↗</a></div>').join('')||'<p>Нет совпадений</p>'}function recommendation(e){let prev=Object.values(S.sessions).filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>s.ex).find(x=>x.name===e.name&&x.rows.some(r=>r.done));let target=Number((e.reps.match(/\d+/g)||[]).at(-1));if(!prev||!target)return '';let rows=prev.rows;if(rows.length&&rows.every(r=>r.done&&+r.r>=target&&+r.w>0))return '<small class="hint">Все подходы достигли цели. При хорошей технике попробуй минимальную прибавку веса.</small>';return '<small class="hint">Сохраняй вес и постепенно увеличивай повторения до '+target+'.</small>'}function exForm(title,e,cb){form(title,input('Название упражнения','en',e?.name||'')+'<label>Выбрать из библиотеки<select id="lib"><option value="">Своё упражнение</option>'+[...new Set([...libraryNames,...CATALOG.map(x=>x[2])])].map(n=>'<option>'+esc(n)+'</option>').join('')+'</select></label>'+input('Подходы','es',e?.sets||3,'number')+input('Целевые повторения','er',e?.reps||'8–12')+'<small>Можно выбрать любое название упражнения.</small>',()=>{let name=val('en').trim(),sets=+val('es'),reps=val('er').trim();if(!name||!Number.isInteger(sets)||sets<1||sets>30||!reps){alert('Укажи название, 1–30 подходов и повторения');return false}cb({...e,id:e?.id||uid(),name,sets,reps})})}
function startRest(){restTotal=S.rest;end=Date.now()+S.rest*1000;tick()}function tick(){let n=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('timer').hidden=!n;document.getElementById('ringProgress').setAttribute('stroke-dashoffset',169.65*(1-Math.min(1,n/restTotal)));document.getElementById('clock').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}setInterval(tick,500);
document.addEventListener('input',e=>{let t=e.target;if(t.id==='libQ'){libQ=t.value;libCards()}if(t.dataset.note!==undefined){ensure().ex[t.dataset.note].note=t.value;save()}if(t.dataset.row){let [i,j,k]=t.dataset.row.split(',');ensure().ex[i].rows[j][k]=t.value;save()}});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='libMuscle'){libMuscle=t.value;libCards()}if(t.id==='libEquipment'){libEquipment=t.value;libCards()}if(t.id==='lib'&&t.value)document.getElementById('en').value=t.value;if(t.id==='date'){date=t.value||today();render()}if(t.id==='activePlan'){S.active=t.value;day=plan().days[0]?.id;save();render()}if(t.id==='statName'){statName=t.value;render()}if(t.id==='planName'){let p=S.plans.find(p=>p.id===editPlan);if(t.value.trim())p.name=t.value.trim();save()}if(t.id==='restSeconds'){S.rest=Math.max(10,Math.min(600,+t.value||90));save();render()}if(t.id==='import'&&t.files[0]){try{let x=JSON.parse(await t.files[0].text());if(x.version!==3||!Array.isArray(x.plans)||!x.sessions||!Array.isArray(x.body)||!x.plans.every(p=>Array.isArray(p.days)&&p.days.every(d=>Array.isArray(d.ex)))||!Object.values(x.sessions).every(s=>Array.isArray(s.ex)&&s.ex.every(e=>Array.isArray(e.rows))))throw Error();if(confirm('Заменить локальные данные резервной копией?')){S=x;S.plans=[defaultPlan,...S.plans.filter(p=>p.id!=='base')];save();render()}}catch(err){alert('Некорректная резервная копия')}}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,id=b.dataset.id||'',[i,j]=id.split(','),p=S.plans.find(p=>p.id===editPlan),d=p?.days.find(d=>d.id===i);switch(a){case'view':view=id;window.scrollTo(0,0);break;case'startHome':day=id;date=today();view='train';window.scrollTo(0,0);break;case'theme':S.theme=S.theme==='light'?'dark':'light';break;case'day':day=id;break;case'rest':startRest();return;case'plus':restTotal+=30;end+=30000;tick();return;case'stop':end=0;tick();return;case'done':{let r=ensure().ex[i].rows[j];r.done=!r.done;if(r.done)startRest();break}case'addSet':{let rows=ensure().ex[i].rows,last=rows.at(-1);rows.push({w:last?.w||'',r:last?.r||'',done:false});break}case'removeSet':if(confirm('Удалить подход?'))ensure().ex[i].rows.splice(j,1);break;case'removeExercise':if(confirm('Удалить упражнение из этой тренировки?'))ensure().ex.splice(i,1);break;case'copyLast':{let ex=ensure().ex[i],prev=Object.values(S.sessions).filter(s=>s.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(s=>s.ex).find(e=>e.name===ex.name&&e.rows.some(r=>r.done));if(!prev){alert('Нет предыдущих результатов');return}ex.rows.forEach((r,j)=>{if(!r.done&&prev.rows[j]){r.w=prev.rows[j].w;r.r=prev.rows[j].r}});break}case'addExercise':exForm('Добавить упражнение',null,x=>ensure().ex.push(fresh(x)));return;case'finish':if(!currentDay())return;{let s=ensure();s.finished=!s.finished;if(s.finished){save();render();summary(s);return}}break;case'use':S.active=id;day=plan().days[0]?.id;view='train';break;case'duplicate':{let x=clone(S.plans.find(p=>p.id===id));x.id=uid();x.name+=' — копия';S.plans.push(x);editPlan=x.id;break}case'newPlan':form('Новая программа',input('Название','pn'),()=>{let n=val('pn').trim();if(!n)return false;let x={id:uid(),name:n,days:[]};S.plans.push(x);editPlan=x.id});return;case'edit':editPlan=id;break;case'deletePlan':if(confirm('Удалить программу? История останется.')){S.plans=S.plans.filter(p=>p.id!==id);if(S.active===id)S.active='base';if(editPlan===id)editPlan=null}break;case'addDay':case'renameDay':form('Тренировочный день',input('Название','dn',d?.name||'')+input('Акцент','df',d?.focus||''),()=>{if(!val('dn').trim())return false;if(d){d.name=val('dn');d.focus=val('df')}else p.days.push({id:uid(),name:val('dn'),focus:val('df'),ex:[]})});return;case'deleteDay':if(confirm('Удалить день из шаблона?'))p.days=p.days.filter(x=>x.id!==id);break;case'templateEx':exForm('Упражнение',null,x=>d.ex.push(x));return;case'editEx':exForm('Редактировать',d.ex[j],x=>d.ex[j]=x);return;case'deleteEx':if(confirm('Удалить из шаблона?'))d.ex.splice(j,1);break;case'moveEx':if(+j>0)[d.ex[j-1],d.ex[j]]=[d.ex[j],d.ex[j-1]];break;case'openSession':{let s=S.sessions[id];if(!S.plans.some(p=>p.id===s.plan&&p.days.some(d=>d.id===s.day))){alert(s.ex.map(e=>e.name+': '+e.rows.map(r=>r.w+' кг × '+r.r).join(', ')).join('\n'));return}S.active=s.plan;day=s.day;date=s.date;view='train';break}case'deleteSession':if(confirm('Удалить запись навсегда?'))delete S.sessions[id];break;case'body':{let w=+val('bodyWeight');if(w<=0||w>500)return;S.body=S.body.filter(x=>x.date!==today());S.body.push({date:today(),w});S.body.sort((a,b)=>a.date.localeCompare(b.date));break}case'export':{let u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='gym-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}default:return}save();render()});save();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
